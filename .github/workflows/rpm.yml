name: RPM

# Builds the RPM of the commit checked out with packaging/rpm.sh, which runs the spec's
# %check, then installs it. ci.yml calls it on each change and release.yml on each tag.
on:
  workflow_call:
    inputs:
      version:
        description: The version to build. A leading v is dropped, so a tag name works.
        required: true
        type: string
      artifact:
        description: The artifact name to upload the RPM under; empty uploads nothing.
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/fedora.Containerfile
          sparse-checkout-cone-mode: false
      # An empty ref would run the build on the bare runner, and a tag alone could change
      # under the build; this check is the pin zizmor can't see through the expression.
      - id: ref
        run: |
          ref=$(sed -n 's/^FROM //p' packaging/fedora.Containerfile)
          case $ref in
            *@sha256:*) ;;
            *)
              echo "::error::packaging/fedora.Containerfile's FROM line must pin a digest (image@sha256:...)"
              exit 1
              ;;
          esac
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

  build:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container: ${{ needs.image.outputs.ref }} # zizmor: ignore[unpinned-images]
    env:
      VERSION: ${{ inputs.version }}
    steps:
      # Before checkout, which without git fetches no repository for rpm.sh to archive.
      - run: dnf -y install git-core rpm-build

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the RPM
        run: |
          rpm=$(packaging/rpm.sh "${VERSION#v}" dist)
          echo "RPM=$rpm" >>"$GITHUB_ENV"

      - name: Install the RPM
        run: dnf -y install "./$RPM"

      - if: inputs.artifact != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ env.RPM }}
          if-no-files-found: error
