name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

# uv installs and builds here too — see ci.yml for why this is set once.
env:
  UV_SYSTEM_PYTHON: 1

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Caching off, stated rather than left to the action's "auto" default:
      # this job publishes, so nothing a cache another workflow wrote should be
      # able to reach the artifact it uploads. zizmor's cache-poisoning audit
      # reads the explicit `false` and not the default, so this is also what
      # keeps the lint gate green.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ci/requirements.txt
          enable-cache: false

      # TODO: Fail the release if the git tag doesn't match your package version.
      # The shipped pyproject.toml keeps `version` static; uncomment to enforce it
      # matches the tag. Repoint `ver=` if you declare the version elsewhere.
      # - name: Verify tag matches package version
      #   run: |
      #     tag="${GITHUB_REF_NAME#v}"
      #     ver="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
      #     if [ "$tag" != "$ver" ]; then
      #       echo "tag '$tag' does not match version '$ver'"
      #       exit 1
      #     fi

      # Publishes on any v* tag with no CI `needs:` gate — a broken tagged commit
      # can ship. The `pypi` environment's deployment-protection approval is the
      # release gate; add required reviewers to it.
      - run: uv pip install -r ci/requirements.txt

      - run: uv build

      - run: python -m twine check dist/*

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
