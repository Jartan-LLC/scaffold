name: Create GitHub Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # The notes and rpm jobs read the tagged checkout with a read-only token; only the
  # attest and release jobs, which run no repository code, hold write tokens.
  notes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout
    outputs:
      source: ${{ steps.notes.outputs.source }}
      notes: ${{ steps.notes.outputs.notes }}
      prerelease: ${{ steps.notes.outputs.prerelease }}
      rpm: ${{ steps.packaging.outputs.rpm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The script prints nothing when the tag has no notes in CHANGELOG.md and
      # says why on stderr; this step then falls back to generated notes. It also
      # says whether the tag is a pre-release, under PEP 440 or SemVer.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=$(python3 ci/release_notes.py --prerelease "$version")
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"
          notes="$RUNNER_TEMP/notes.md"
          why="$RUNNER_TEMP/why"
          python3 ci/release_notes.py "$version" CHANGELOG.md >"$notes" 2>"$why" \
            || { cat "$why" >&2; exit 1; }
          if [ -s "$notes" ]; then
            delimiter="EOF_$(openssl rand -hex 16)"
            { echo "notes<<$delimiter"; cat "$notes"; echo "$delimiter"; } >>"$GITHUB_OUTPUT"
            echo "source=changelog" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::$(<"$why"); using generated release notes for $GITHUB_REF_NAME"
            echo "source=generated" >>"$GITHUB_OUTPUT"
          fi

      # Each release attaches an RPM while the project ships one.
      - id: packaging
        run: |
          if [ -f packaging/rpm.spec ]; then
            echo "rpm=true" >>"$GITHUB_OUTPUT"
          fi

  rpm:
    needs: notes
    if: needs.notes.outputs.rpm == 'true'
    permissions:
      contents: read
    # actionlint rejects the $/ form zizmor asks for (rhysd/actionlint#711).
    uses: ./.github/workflows/rpm.yml # zizmor: ignore[self-repository]
    with:
      version: ${{ github.ref_name }}
      artifact: release-rpm

  attest:
    needs: rpm
    # Attestations need a public repository, or a private one on GitHub Enterprise Cloud,
    # which can drop this condition. Elsewhere the action fails and the tag gets no Release.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-rpm
          path: assets
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*

  release:
    # A skipped rpm job attaches nothing; a failed one stops the release.
    needs: [notes, rpm, attest]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - if: needs.rpm.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-rpm
          path: assets

      # No checkout needed: gh talks to the API and resolves the repo from
      # GH_REPO. The view-or-create guard keeps re-runs on the same tag
      # idempotent instead of failing with "release already exists".
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES_SOURCE: ${{ needs.notes.outputs.source }}
          PRERELEASE: ${{ needs.notes.outputs.prerelease }}
          # Linux caps one environment variable at 128 KiB, so a section longer
          # than that fails this step, on a re-run too.
          NOTES: ${{ needs.notes.outputs.notes }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          case "$NOTES_SOURCE" in
            changelog)
              [ -n "$NOTES" ] || { echo "::error::The notes job passed no notes"; exit 1; }
              printf '%s\n' "$NOTES" >"$RUNNER_TEMP/notes.md"
              args=(--notes-file "$RUNNER_TEMP/notes.md")
              ;;
            generated) args=(--generate-notes) ;;
            *) echo "::error::The notes job set no notes source"; exit 1 ;;
          esac
          case "$PRERELEASE" in
            true) args+=(--prerelease) ;;
            false) ;;
            *) echo "::error::The notes job did not say whether this is a pre-release"; exit 1 ;;
          esac
          # With files, gh creates a draft, uploads them, then publishes it, and deletes
          # the draft if an upload fails.
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" assets/* --title "$GITHUB_REF_NAME" "${args[@]}" --verify-tag
