# The Pages workflow's workflow_run trigger names this workflow by this name.
name: Create GitHub Release

on:
  push:
    tags:
      - "v*"

# One run at a time across tags, in push order: the sign job lists the earlier full releases,
# and an earlier tag's Release exists only once its own run has finished.
concurrency:
  group: ${{ github.workflow }}
  queue: max

permissions: {}

jobs:
  # The notes and rpm jobs read the tagged checkout with a read-only token; only the
  # attest and release jobs, which run no repository code, hold write tokens. The sign job
  # holds the signing key and a read-only token, and runs only packaging/dnf-repo.sh from
  # the tag.
  notes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout
    outputs:
      source: ${{ steps.notes.outputs.source }}
      notes: ${{ steps.notes.outputs.notes }}
      prerelease: ${{ steps.notes.outputs.prerelease }}
      rpm: ${{ steps.packaging.outputs.rpm }}
      dnf_repo: ${{ steps.packaging.outputs.dnf_repo }}
      artifact: ${{ steps.packaging.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The script prints nothing when the tag has no notes in CHANGELOG.md and
      # says why on stderr; this step then falls back to generated notes. It also
      # says whether the tag is a pre-release, under PEP 440 or SemVer.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=$(python3 ci/release_notes.py --prerelease "$version")
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"
          notes="$RUNNER_TEMP/notes.md"
          why="$RUNNER_TEMP/why"
          python3 ci/release_notes.py "$version" CHANGELOG.md >"$notes" 2>"$why" \
            || { cat "$why" >&2; exit 1; }
          if [ -s "$notes" ]; then
            delimiter="EOF_$(openssl rand -hex 16)"
            { echo "notes<<$delimiter"; cat "$notes"; echo "$delimiter"; } >>"$GITHUB_OUTPUT"
            echo "source=changelog" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::$(<"$why"); using generated release notes for $GITHUB_REF_NAME"
            echo "source=generated" >>"$GITHUB_OUTPUT"
          fi

      # Each release attaches an RPM while packaging/rpm.spec exists, signed while
      # packaging/dnf.repo exists.
      - id: packaging
        run: |
          if [ -f packaging/rpm.spec ]; then
            echo "rpm=true" >>"$GITHUB_OUTPUT"
          fi
          if [ -f packaging/dnf.repo ]; then
            echo "dnf_repo=true" >>"$GITHUB_OUTPUT"
            echo "artifact=release-assets" >>"$GITHUB_OUTPUT"
          else
            echo "artifact=release-rpm" >>"$GITHUB_OUTPUT"
          fi

  rpm:
    needs: notes
    if: needs.notes.outputs.rpm == 'true'
    permissions:
      contents: read
    # actionlint rejects the $/ form zizmor asks for (rhysd/actionlint#711).
    uses: ./.github/workflows/rpm.yml # zizmor: ignore[self-repository]
    with:
      version: ${{ github.ref_name }}
      artifact: release-rpm

  # Signs the RPM, and on a full release builds the dnf repository's signed metadata for it
  # and the earlier full releases published most recently, so dnf downgrade and dnf history
  # undo have the previous version. A pre-release stays out of the repository.
  sign:
    needs: [notes, rpm]
    if: needs.notes.outputs.dnf_repo == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: rpm-signing
    permissions:
      contents: read # checkout, and the earlier releases' assets
    # rpm.yml's image job fails unless the ref is pinned by digest.
    container: ${{ needs.rpm.outputs.image }} # zizmor: ignore[unpinned-images]
    defaults:
      run:
        shell: bash
    steps:
      # Before checkout, which without git ignores sparse-checkout and downloads the whole
      # tree.
      - run: dnf -y install createrepo_c rpm-sign gnupg2 gh git-core

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            packaging/dnf-repo.sh
            packaging/RPM-GPG-KEY
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-rpm
          path: rpm

      - name: Find the RPM
        run: |
          shopt -s nullglob
          rpms=(rpm/*.noarch.rpm)
          if ((${#rpms[@]} != 1)); then
            echo "::error::The release-rpm artifact holds ${#rpms[@]} noarch RPMs, not 1"
            exit 1
          fi
          echo "RPM=${rpms[0]}" >>"$GITHUB_ENV"

      - name: Sign the RPM, and build the repository bundle on a full release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: 4
          PRERELEASE: ${{ needs.notes.outputs.prerelease }}
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
        run: packaging/dnf-repo.sh release "$RPM" packaging/RPM-GPG-KEY out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.notes.outputs.artifact }}
          path: out
          if-no-files-found: error

  attest:
    needs: [notes, rpm, sign]
    # Attestations need a public repository, or a private one on GitHub Enterprise Cloud,
    # which can drop the private condition. Elsewhere the action fails and the tag gets no
    # Release. While packaging/dnf.repo exists, it attests the sign job's files.
    if: >-
      !cancelled() && !github.event.repository.private && needs.rpm.result == 'success'
      && (needs.notes.outputs.dnf_repo != 'true' || needs.sign.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.notes.outputs.artifact }}
          path: assets
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*

  release:
    # A skipped rpm job attaches nothing; a failed rpm or sign job stops the release. While
    # packaging/dnf.repo exists, the RPM comes only from the sign job's files, and only once
    # that job succeeds, so the unsigned RPM is never released.
    needs: [notes, rpm, sign, attest]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure')
      && (needs.rpm.result != 'success' || needs.notes.outputs.dnf_repo != 'true'
      || needs.sign.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - if: needs.rpm.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.notes.outputs.artifact }}
          path: assets

      # No checkout needed: gh talks to the API and resolves the repo from
      # GH_REPO. The view-or-create guard keeps re-runs on the same tag
      # idempotent instead of failing with "release already exists".
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES_SOURCE: ${{ needs.notes.outputs.source }}
          PRERELEASE: ${{ needs.notes.outputs.prerelease }}
          # Linux caps one environment variable at 128 KiB, so a section longer
          # than that fails this step, on a re-run too.
          NOTES: ${{ needs.notes.outputs.notes }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          case "$NOTES_SOURCE" in
            changelog)
              [ -n "$NOTES" ] || { echo "::error::The notes job passed no notes"; exit 1; }
              printf '%s\n' "$NOTES" >"$RUNNER_TEMP/notes.md"
              args=(--notes-file "$RUNNER_TEMP/notes.md")
              ;;
            generated) args=(--generate-notes) ;;
            *) echo "::error::The notes job set no notes source"; exit 1 ;;
          esac
          case "$PRERELEASE" in
            true) args+=(--prerelease) ;;
            false)
              # Without --latest, GitHub marks the release published last Latest, so a lower
              # version that a re-run or the queue publishes after a higher one would take
              # it, and the Pages workflow would serve its dnf repository. sort -V, not
              # ci/versions.py, as this job runs no repository code: it orders full releases
              # as PEP 440 and SemVer do, except for epochs. It can put a tag that isn't v and
              # a digit, such as vnext, above every version, so those tags are left out.
              tags=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 \
                --json tagName --jq '.[].tagName')
              highest=$(printf '%s\n%s\n' "$tags" "$GITHUB_REF_NAME" | sed -n '/^v[0-9]/p' |
                sort -V | tail -n 1)
              if [ "$highest" = "$GITHUB_REF_NAME" ]; then
                args+=(--latest)
              else
                case "$GITHUB_REF_NAME" in
                  v[0-9]*) echo "::notice::$highest is a higher full release, so $GITHUB_REF_NAME is not marked Latest" ;;
                  *) echo "::notice::$GITHUB_REF_NAME doesn't start with v and a digit, so it is not marked Latest" ;;
                esac
                args+=(--latest=false)
              fi
              ;;
            *) echo "::error::The notes job did not say whether this is a pre-release"; exit 1 ;;
          esac
          # With files, gh creates a draft, uploads them, then publishes it, and deletes
          # the draft if an upload fails.
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" assets/* --title "$GITHUB_REF_NAME" "${args[@]}" --verify-tag
