name: Create GitHub Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # The notes job reads the tagged checkout with a read-only token; only the
  # release job, which runs no repository code, holds the write token.
  notes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout
    outputs:
      source: ${{ steps.notes.outputs.source }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # tests/test_release_notes.py covers the script. It prints nothing when
      # the tag has no notes in CHANGELOG.md, and this step then falls back to
      # generated notes.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          notes="$RUNNER_TEMP/notes.md"
          python3 .github/scripts/release_notes.py "${GITHUB_REF_NAME#v}" CHANGELOG.md >"$notes"
          if [ -s "$notes" ]; then
            delimiter="EOF_$(openssl rand -hex 16)"
            { echo "notes<<$delimiter"; cat "$notes"; echo "$delimiter"; } >>"$GITHUB_OUTPUT"
            echo "source=changelog" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::No release notes for $GITHUB_REF_NAME in CHANGELOG.md; using generated release notes"
            echo "source=generated" >>"$GITHUB_OUTPUT"
          fi

  release:
    needs: notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No checkout needed: gh talks to the API and resolves the repo from
      # GH_REPO. The view-or-create guard keeps re-runs on the same tag
      # idempotent instead of failing with "release already exists".
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES_SOURCE: ${{ needs.notes.outputs.source }}
          NOTES: ${{ needs.notes.outputs.notes }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          case "$NOTES_SOURCE" in
            changelog)
              [ -n "$NOTES" ] || { echo "::error::The notes job passed no notes"; exit 1; }
              printf '%s\n' "$NOTES" >"$RUNNER_TEMP/notes.md"
              notes=(--notes-file "$RUNNER_TEMP/notes.md")
              ;;
            generated) notes=(--generate-notes) ;;
            *) echo "::error::The notes job set no notes source"; exit 1 ;;
          esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" "${notes[@]}" --verify-tag
