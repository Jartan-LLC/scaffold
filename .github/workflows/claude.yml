name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  claude:
    # author_association narrows who can trigger, but does not discriminate a
    # human org member from a machine account in the same org — the token
    # below carries no write scope regardless of who passes this gate.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # JAR-687: author_association cannot tell a human org member from a
    # machine account in the same org — every agent workforce account is
    # MEMBER (JAR-681) — so this run must not hold write capability regardless
    # of who or what passes the gate above.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # Read-only: this run is triggered by content any GitHub account or
          # machine principal can author — JAR-687.
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      # Token is used by claude-code-action to push commits; no artifacts are
      # uploaded, so persisting it is safe.
      - name: Checkout repository # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # head_ref is empty for these triggers, so this resolves to the default
          # branch — never fork-PR code. Avoids CodeQL's untrusted-checkout flag.
          ref: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      # A bare URL in plugin_marketplaces resolves to grimoire's default branch
      # at job time, and its plugins run node on SessionStart/PreToolUse without
      # a prompt. The input takes no ref, so pin via a local path instead.
      # Bump in step with .claude/settings.json.
      - name: Fetch the grimoire marketplace at a pinned tag
        env:
          GRIMOIRE_REF: marketplace-v1.0.0
        run: |
          git clone --depth 1 --branch "$GRIMOIRE_REF" \
            https://github.com/Jartan-LLC/grimoire.git "$RUNNER_TEMP/grimoire"
          git -C "$RUNNER_TEMP/grimoire" rev-parse HEAD

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@459ad358ae43fea66bfefd0a1f8d840b4b9791fb # v1.0.194
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}

          # The pinned clone from the step above. claude-plugins-official is
          # dropped: nothing below installs from it.
          plugin_marketplaces: |
            ${{ runner.temp }}/grimoire

          plugins: |
            claudivis@grimoire
            gitwise@grimoire
            praxis@grimoire
            pythonica@grimoire
            recursio@grimoire

          claude_args: |
            --model claude-opus-4-6
