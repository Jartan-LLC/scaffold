name: CI

on:
  pull_request:
    branches: [main]
  # Dev extras and hook envs resolve at run time within their bounds, so `main`
  # can go red with no commit touching it; these catch that before the next PR does.
  push:
    branches: [main]
  schedule:
    - cron: "10 7 * * 1" # weekly, Monday 07:10 UTC (offset from scorecard/link-check)
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_SYSTEM_PYTHON: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # `version-file` is required: without it this action installs uv `latest`,
      # not the ci/requirements.txt pin.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      # All file linters live in .pre-commit-config.yaml (the single source, shared
      # with `make lint`). pre-commit manages its own hook envs, so no
      # pyproject/dev-extras, which keeps this job language-agnostic.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-
      - run: uv pip install -r ci/requirements.txt
      - run: pre-commit run --all-files --show-diff-on-failure

      # Node/JS (secondary) — uncomment after adding package.json + committing a lockfile.
      # `prettier --check` is the generic part; drop `astro check` unless you use Astro.
      # - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      #   with:
      #     version: 10
      # - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      #   with:
      #     node-version: "22"
      #     cache: pnpm
      #     cache-dependency-path: pnpm-lock.yaml
      # - run: pnpm install --frozen-lockfile
      # - run: pnpm exec prettier --check .

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      - run: uv pip install -e '.[dev]'
      - run: pyright

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Add `needs: lint` to skip tests when lint fails — saves runner time on slow
    # suites, at the cost of not seeing lint and test failures in a single run.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: ci/requirements.txt
          enable-cache: true
          # One cache per interpreter: the matrix legs resolve different wheels.
          cache-suffix: py${{ matrix.python-version }}

      - run: uv pip install -e '.[dev]'
      - run: pytest -m "not integration"

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache: this job only installs the pinned CI tools (nothing
      # from pyproject), and `uv build` builds the project in its own isolated env.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: ci/requirements.txt

      - run: uv pip install -r ci/requirements.txt
      - run: uv build
      - run: python -m twine check dist/*

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      # Audit the full installed environment — package deps plus the dev/docs/CI
      # tools — mirroring `make check`, not just the (currently empty) declared deps.
      - run: uv pip install -e '.[dev,docs]' -r ci/requirements.txt
      - name: Audit dependencies for known CVEs
        run: pip-audit

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      # Install so the docs toolchain and the package's runtime deps are importable
      # by autodoc (the stub's are all stdlib).
      - run: uv pip install -e '.[docs]'
      - run: sphinx-build -W -b html docs docs/_build/html

  # Integration tests against a docker-compose stack, with coverage uploaded as an
  # artifact. Uncomment once you add a docker-compose.test.yml (service `app`) and a
  # Dockerfile test target, and add `pytest-cov` to the dev extras. Then add
  # `integration-tests` to the `check` job's needs + results below.
  # TODO(rename): `--cov=app` (and the `app` service/paths) track the package name.
  # integration-tests:
  #   runs-on: ubuntu-24.04
  #   timeout-minutes: 20
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         persist-credentials: false
  #     - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
  #     - name: Start stack
  #       run: docker compose -f docker-compose.test.yml up -d --build --wait
  #     - name: Integration tests + coverage
  #       run: docker compose -f docker-compose.test.yml exec -T app python -m pytest -m integration --cov=app --cov-report=xml:/app/coverage.xml
  #     - name: Extract coverage
  #       if: always()
  #       run: docker compose -f docker-compose.test.yml cp app:/app/coverage.xml ./coverage.xml
  #     - name: Upload coverage
  #       if: always()
  #       uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
  #       with:
  #         name: coverage-report
  #         path: coverage.xml
  #         if-no-files-found: warn
  #     - name: Tear down
  #       if: always()
  #       run: docker compose -f docker-compose.test.yml down -v

  # Docker build + smoke test. The shipped Dockerfile builds as-is; give it a real
  # entrypoint, then uncomment (pairs with publish-docker.yml). Swap `--help` for a
  # /health curl if it's a server. Add `docker` to the `check` job below when enabling.
  # docker:
  #   runs-on: ubuntu-24.04
  #   timeout-minutes: 10
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         persist-credentials: false
  #     - run: docker build -t app:ci .
  #     - run: docker run --rm app:ci --help

  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      devcontainer: ${{ steps.diff.outputs.devcontainer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # A PR's merge commit has its base as first parent. With no base (a manual run, a
      # failed fetch) the jobs run, rather than risk skipping a change.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) git fetch -q --depth=1 origin "$BEFORE" && base=$BEFORE ;;
          esac
          if [ -z "${base:-}" ] \
              || git diff --name-only "$base" HEAD | grep -q -e '^\.devcontainer/' -e '^\.github/workflows/ci\.yml$'; then
            echo devcontainer=true >>"$GITHUB_OUTPUT"
          fi

  liza-smoke:
    name: Liza smoke test
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .devcontainer/liza/install.sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bash .devcontainer/liza/smoke-test.sh

  devcontainer:
    name: Dev container (Liza ${{ matrix.activate && 'on' || 'off' }}, tools ${{ matrix.tools && 'on' || 'off' }})
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        activate: [true, false]
        tools: [true, false]
    # Read by devcontainer.json's ${localEnv:…} defaults, as a host override would be.
    env:
      ACTIVATE_LIZA: ${{ matrix.activate }}
      INSTALL_LIZA_TOOLS: ${{ matrix.tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # The gha cache backend reads these; devcontainers/ci doesn't pass them to buildx.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ["ACTIONS_RUNTIME_TOKEN", "ACTIONS_RESULTS_URL", "ACTIONS_CACHE_URL", "ACTIONS_CACHE_SERVICE_V2"]) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }
      # The image is the same in every cell, so one cell writes the cache.
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          cacheFrom: type=gha,scope=devcontainer
          cacheTo: ${{ matrix.activate && matrix.tools && 'type=gha,mode=max,scope=devcontainer' || '' }}
          runCmd: bash .devcontainer/verify.sh

  check:
    if: always()
    # When you uncomment integration-tests / docker above, add them to BOTH the
    # needs list and the results array below.
    needs: [lint, typecheck, test, build, audit, docs, changes, liza-smoke, devcontainer]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: |
          results=("${{ needs.lint.result }}" "${{ needs.typecheck.result }}" "${{ needs.test.result }}" "${{ needs.build.result }}" "${{ needs.audit.result }}" "${{ needs.docs.result }}" "${{ needs.changes.result }}" "${{ needs.liza-smoke.result }}" "${{ needs.devcontainer.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "Check failed: $r"
              exit 1
            fi
          done
