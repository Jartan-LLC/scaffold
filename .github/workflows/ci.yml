name: CI

on:
  pull_request:
    branches: [main]
  # A build on `main` plus a weekly one. Dev extras and hook envs resolve at run
  # time within their bounds, so `main` can go red with no commit touching it;
  # without these, the next unrelated PR is what discovers the drift.
  push:
    branches: [main]
  schedule:
    - cron: "10 7 * * 1" # weekly, Monday 07:10 UTC (offset from scorecard/link-check)
  workflow_dispatch:

permissions:
  contents: read

# uv installs everything here, in place of pip. `--system` on every call would
# say the same thing 8 times, so it is set once: uv targets the interpreter
# actions/setup-python put on PATH rather than demanding a virtualenv.
env:
  UV_SYSTEM_PYTHON: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # uv's own version is read from ci/requirements.txt, the file that already
      # pins every other tool the gate installs — so Dependabot's "/ci" entry
      # bumps uv too, and the runner, devcontainer and `make check` never drift
      # apart. Without `version-file` this action installs uv `latest`, which is
      # the unpinned-tool failure this repo exists to have closed.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      # All file linters live in .pre-commit-config.yaml (the single source, shared
      # with `make lint`). Install only pre-commit — it manages its own hook envs, so
      # no pyproject/dev-extras, which keeps this job language-agnostic. The runner
      # is exact-pinned in ci/requirements.txt; the hook revs there are frozen SHAs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-
      - run: uv pip install -r ci/requirements.txt
      - run: pre-commit run --all-files --show-diff-on-failure

      # Node/JS (secondary) — uncomment after adding package.json + committing a lockfile.
      # `prettier --check` is the generic part; drop `astro check` unless you use Astro.
      # - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      #   with:
      #     version: 10
      # - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      #   with:
      #     node-version: "22"
      #     cache: pnpm
      #     cache-dependency-path: pnpm-lock.yaml
      # - run: pnpm install --frozen-lockfile
      # - run: pnpm exec prettier --check .

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # setup-uv's cache replaces setup-python's `cache: pip`: it keys off
      # pyproject.toml and ci/requirements.txt by default, and it caches uv's
      # own wheel store, which is what the install actually reads.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      - run: uv pip install -e '.[dev]'
      - run: pyright

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Add `needs: lint` to skip tests when lint fails — saves runner time on slow
    # suites, at the cost of not seeing lint and test failures in a single run.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ci/requirements.txt
          enable-cache: true
          # One cache per interpreter: the matrix legs resolve different wheels.
          cache-suffix: py${{ matrix.python-version }}

      - run: uv pip install -e '.[dev]'
      - run: pytest -m "not integration"

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache: this job only installs the pinned CI tools (nothing
      # from pyproject), and `uv build` builds the project in its own isolated env.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ci/requirements.txt

      # `uv build` replaces `python -m build` and does the same thing — resolve
      # the declared build backend into an isolated env, build the sdist, then
      # build the wheel from it — so `build` left ci/requirements.txt. twine
      # stays: uv has no equivalent metadata check.
      - run: uv pip install -r ci/requirements.txt
      - run: uv build
      - run: python -m twine check dist/*

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      # Audit the full installed environment — package deps plus the dev/docs/CI
      # tools — mirroring `make check`, not just the (currently empty) declared deps.
      # pip-audit reads the environment, not a lockfile, so uv installing it
      # changes nothing here.
      - run: uv pip install -e '.[dev,docs]' -r ci/requirements.txt
      - name: Audit dependencies for known CVEs
        run: pip-audit

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      # Install so the docs toolchain and the package's runtime deps are importable
      # by autodoc (the stub's are all stdlib).
      - run: uv pip install -e '.[docs]'
      - run: sphinx-build -W -b html docs docs/_build/html

  # Integration tests against a docker-compose stack, with coverage uploaded as an
  # artifact. Uncomment once you add a docker-compose.test.yml (service `app`) and a
  # Dockerfile test target, and add `pytest-cov` to the dev extras. Then add
  # `integration-tests` to the `check` job's needs + results below.
  # TODO(rename): `--cov=app` (and the `app` service/paths) track the package name.
  # integration-tests:
  #   runs-on: ubuntu-24.04
  #   timeout-minutes: 20
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         persist-credentials: false
  #     - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
  #     - name: Start stack
  #       run: docker compose -f docker-compose.test.yml up -d --build --wait
  #     - name: Integration tests + coverage
  #       run: docker compose -f docker-compose.test.yml exec -T app python -m pytest -m integration --cov=app --cov-report=xml:/app/coverage.xml
  #     - name: Extract coverage
  #       if: always()
  #       run: docker compose -f docker-compose.test.yml cp app:/app/coverage.xml ./coverage.xml
  #     - name: Upload coverage
  #       if: always()
  #       uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
  #       with:
  #         name: coverage-report
  #         path: coverage.xml
  #         if-no-files-found: warn
  #     - name: Tear down
  #       if: always()
  #       run: docker compose -f docker-compose.test.yml down -v

  # Docker build + smoke test. The shipped Dockerfile builds as-is; give it a real
  # entrypoint, then uncomment (pairs with publish-docker.yml). Swap `--help` for a
  # /health curl if it's a server. Add `docker` to the `check` job below when enabling.
  # docker:
  #   runs-on: ubuntu-24.04
  #   timeout-minutes: 10
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         persist-credentials: false
  #     - run: docker build -t app:ci .
  #     - run: docker run --rm app:ci --help

  check:
    if: always()
    # When you uncomment integration-tests / docker above, add them to BOTH the
    # needs list and the results array below.
    needs: [lint, typecheck, test, build, audit, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: |
          results=("${{ needs.lint.result }}" "${{ needs.typecheck.result }}" "${{ needs.test.result }}" "${{ needs.build.result }}" "${{ needs.audit.result }}" "${{ needs.docs.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "Check failed: $r"
              exit 1
            fi
          done
