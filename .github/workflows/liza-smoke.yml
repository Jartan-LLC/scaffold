name: Liza smoke test

# Liza's init behavior can change with each release; this re-checks that the shim keeps
# activation local-scope whenever the pin, the shim or its helpers change.
on:
  pull_request:
    branches: [main]
    paths:
      - ".devcontainer/liza/**"
      - ".devcontainer/fetch-verified.sh"
      - ".github/workflows/liza-smoke.yml"
  push:
    branches: [main]
    paths:
      - ".devcontainer/liza/**"
      - ".devcontainer/fetch-verified.sh"
      - ".github/workflows/liza-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .devcontainer/liza/install.sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bash .devcontainer/liza/smoke-test.sh
