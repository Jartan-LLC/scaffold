# TODO(/onboard): if the project isn't Python, delete this file (docs/onboard.md, Not a Python project).
[build-system]
requires = ["hatchling>=1.33.0,<2"] # latest; >=1.22 is the PEP 639 license-files floor
build-backend = "hatchling.build"

[project]
# TODO(/onboard): rename to your project's distribution name.
name = "app"
version = "0.0.0"
description = "Project template"  # TODO(/onboard): the project's one-line description
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# The test and typecheck toolchain CI runs. ruff and codespell are configured in
# this file but versioned by their hook revs in .pre-commit-config.yaml.
# Upper bounds stop at each tool's next breaking release, so Dependabot proposes
# that bump as a PR rather than CI picking it up unannounced.
dev = [
    "pytest>=9.2.0,<10",     # test runner
    "pyright==1.1.414",    # static type checker; every release is 1.1.x
]
# Docs site toolchain (Sphinx + MyST + furo). Install with `uv pip install -e '.[docs]'`.
# Pinned deliberately: chose Sphinx over MkDocs because the MkDocs ecosystem is
# mid-transition (MkDocs 2.0 drops plugins); Sphinx is stable, but pin anyway.
docs = [
    "sphinx>=9.1.1,<10",     # site generator (reads google docstrings via napoleon)
    "myst-parser>=5.1.0,<6", # author docs in Markdown, not reStructuredText
    "furo>=2025.12.19",     # theme (CalVer — date floor, no semver major to cap)
]

# src-layout: the wheel contains the package directory under src/.
# TODO(/onboard): point packages at the package directory once src/app/ is renamed.
# Hatchling ships the package's non-.py files (the py.typed PEP 561 marker)
# automatically.
[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# Keep the sdist to source + tests + the root conftest.py, so the suite and its
# fixtures ship consistently — not dev tooling like .github/ or .devcontainer/,
# nor the tests of the scripts in ci/ and packaging/, which need those directories.
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "conftest.py"]
exclude = [
    "tests/test_release_notes.py",
    "tests/test_changes.py",
    "tests/test_versions.py",
    "tests/test_rpm_sh.py",
    "tests/test_dnf_repo_sh.py",
]

[tool.ruff]
target-version = "py312"
line-length = 100

# Comprehensive lint: bugs, security, perf, modernization, imports, naming.
# `ruff format` owns formatting, so line length (E501) is left to it.
[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort (import sorting)
    "N",        # pep8-naming
    "D",        # pydocstyle (docstring discipline; convention set below)
    "UP",       # pyupgrade (modern syntax)
    "B",        # flake8-bugbear (likely bugs)
    "A",        # flake8-builtins (shadowing builtins)
    "C4",       # flake8-comprehensions
    "DTZ",      # flake8-datetimez (tz-aware datetimes)
    "T20",      # flake8-print (no stray print)
    "PT",       # flake8-pytest-style
    "RET",      # flake8-return
    "SIM",      # flake8-simplify
    "TID",      # flake8-tidy-imports
    "PTH",      # flake8-use-pathlib
    "PERF",     # perflint
    "FURB",     # refurb (more modernization)
    "PIE",      # flake8-pie
    "ARG",      # unused arguments
    "LOG", "G", # logging correctness
    "ASYNC",    # async gotchas
    "S",        # flake8-bandit (security)
    "PL",       # pylint (C/E/R/W)
    "RUF",      # ruff-specific
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]                      # allow re-exports
"tests/**" = ["S101", "ARG", "PLR2004", "D"]  # asserts, fixtures, magic values, docstrings

[tool.ruff.lint.flake8-tidy-imports]
# Absolute imports only, so the package keeps one import style.
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
# Google-style docstrings; the convention also settles the mutually incompatible
# D203/D211 and D212/D213 pairs.
convention = "google"

[tool.pytest.ini_options]
# `src` is a testpath so `--doctest-modules` reaches the docstring examples the
# docs publish: an example that stops matching its code fails the suite. It also
# imports every module under `src` on every run — the cost of the gate.
testpaths = ["tests", "src"]
addopts = "--strict-markers --strict-config --doctest-modules"
xfail_strict = true
markers = [
    "unit: fast test with no external services",
    "integration: needs the docker-compose stack (see the commented integration-tests job in ci.yml)",
]

[tool.pyright]
include = ["src", "tests", "conftest.py", "ci"]
pythonVersion = "3.12"
# "strict" is the most thorough; drop to "standard" (pyright's default) if
# untyped third-party deps get noisy.
typeCheckingMode = "strict"

[tool.codespell]
# Skip generated/legal/vendored text. Add false positives via:
#   ignore-words-list = "word1,word2"
skip = "./.git,./.venv,./node_modules,./dist,./build,./docs/_build,*.egg-info,*.lock,*-lock.json,LICENSE*"
